<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B9M Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: salle de sport — barre de club en tête, onglets, plan de travail centré ; tableau d'affichage sombre pour le match, accueil neutre (graphite), puis thème dérivé des couleurs du club choisi (couleur principale adoucie + couleur de contraste) */
:root {
  --bg: #f4f4f3;
  --surface: #ffffff;
  --sunk: #e9e9e7;
  --line: #d9d9d6;
  --fg: #1a1c1e;
  --muted: #63676c;
  --accent: #33373c;
  --accent-soft: #e9eaeb;
  --court: #43484e;
  --court-soft: #e5e6e7;
  --good: #23824f;
  --bad: #c0392b;
  --warn: #b7791f;
  --board: #1a1c1f;
  --board-fg: #f4f5fb;
  --board-dim: #9a9ea4;
  --digit: #f0f0ee;
  --iso-ground: #d9e2d6; --iso-campus: #cfdcc9; --iso-road: #b8c2ca; --iso-mark: #f4f7f9; --iso-grey: #c3cbd2; --iso-roof: #a9b3bc;
  --iso-win: #eef4f8; --iso-tree: #a6b8ab; --iso-trunk: #8a8f86; --iso-edge: rgba(15,30,44,0.35); --iso-door: #2a3540; --iso-pitch: #9fb1c0;
  --iso-gym: #21867a; --iso-youth: #c2557a; --iso-office: #c99a2e; --iso-press: #b8433a;
  --iso-side: #e9eef0; --iso-unit: #b4bdc5; --iso-lamp: #f6c453; --iso-glow: 0; --iso-water: #7fb6d6; --iso-stone: #d6dbdf; --iso-tree2: #8fa597; --iso-turf: #9cc29a; --iso-bed: #c9a7a0; --iso-glass: #bcd5e6; --iso-pole: #6b7781; --iso-gridline: rgba(15,30,44,0.05);
  --f-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --gold: #6f747a;
  --star: #a3852f;
  --zone: #a4a8ad;
  --on-accent: #ffffff;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1011; --surface: #17191b; --sunk: #121315; --line: #2a2d30; --fg: #e8e9ea; --muted: #9a9ea3;
    --accent: #d7d9dc; --accent-soft: #26292c; --court: #3d4247; --court-soft: #202326;
    --good: #4cc282; --bad: #ef6b5e; --warn: #e3a948;
    --board: #08090a; --board-fg: #f4f5f6; --board-dim: #8b9095; --digit: #f0f0ee; --gold: #b9bdc2; --star: #cdb064; --zone: #6f747a; --on-accent: #111214; --pos-fg: #c9ccd0;
 --iso-side: #24323d; --iso-unit: #2b3844; --iso-lamp: #ffd47a; --iso-glow: 0.35; --iso-water: #2f6f93; --iso-stone: #3a4652; --iso-tree2: #253c35; --iso-turf: #2c5236; --iso-bed: #5a3a38; --iso-glass: #5f88a6; --iso-pole: #8a98a5; --iso-gridline: rgba(255,255,255,0.03);
 --iso-ground: #1a2731; --iso-campus: #1e2f3a; --iso-road: #2c3a46; --iso-mark: #66798a; --iso-grey: #3a4855; --iso-roof: #2f3c48; --iso-win: #ffd98a; --iso-tree: #2f4a42; --iso-trunk: #4a5550; --iso-edge: rgba(0,0,0,0.55); --iso-door: #0b1117; --iso-pitch: #2c4459; --iso-gym: #2fa596; --iso-youth: #e07a9c; --iso-office: #d8aa3e; --iso-press: #cf5a4f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1011; --surface: #17191b; --sunk: #121315; --line: #2a2d30; --fg: #e8e9ea; --muted: #9a9ea3;
  --accent: #d7d9dc; --accent-soft: #26292c; --court: #3d4247; --court-soft: #202326;
  --good: #4cc282; --bad: #ef6b5e; --warn: #e3a948;
  --board: #08090a; --board-fg: #f4f5f6; --board-dim: #8b9095; --digit: #f0f0ee; --gold: #b9bdc2; --star: #cdb064; --zone: #6f747a; --on-accent: #111214; --pos-fg: #c9ccd0;
 --iso-side: #24323d; --iso-unit: #2b3844; --iso-lamp: #ffd47a; --iso-glow: 0.35; --iso-water: #2f6f93; --iso-stone: #3a4652; --iso-tree2: #253c35; --iso-turf: #2c5236; --iso-bed: #5a3a38; --iso-glass: #5f88a6; --iso-pole: #8a98a5; --iso-gridline: rgba(255,255,255,0.03);
 --iso-ground: #1a2731; --iso-campus: #1e2f3a; --iso-road: #2c3a46; --iso-mark: #66798a; --iso-grey: #3a4855; --iso-roof: #2f3c48; --iso-win: #ffd98a; --iso-tree: #2f4a42; --iso-trunk: #4a5550; --iso-edge: rgba(0,0,0,0.55); --iso-door: #0b1117; --iso-pitch: #2c4459; --iso-gym: #2fa596; --iso-youth: #e07a9c; --iso-office: #d8aa3e; --iso-press: #cf5a4f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 0 48px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.15rem; text-transform: uppercase; letter-spacing: 0.06em; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.wrap { max-width: 1440px; margin: 0 auto; }

/* Barre de club */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 0; }
.clubbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.badge { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 8px; color: #fff; font-family: var(--f-display); font-weight: 800; font-size: 0.95rem; letter-spacing: 0.04em; flex: none; }
.badge { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.28); }
.badge.sm { width: 26px; height: 26px; font-size: 0.7rem; border-radius: 5px; }
.clubbar .name { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; line-height: 1; }
.clubbar .sub { font-size: 0.82rem; color: var(--muted); }
.clubbar .spacer { flex: 1; }
.next { font-size: 0.85rem; color: var(--muted); text-align: right; }
.next b { color: var(--fg); font-weight: 600; }
.nextwrap { display: flex; align-items: center; gap: 12px; }
.nextbtn { white-space: nowrap; }
@media (max-width: 560px) { .nextwrap { width: 100%; justify-content: space-between; } }
nav.tabs { display: flex; gap: 4px; margin-top: 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav.tabs button { background: none; border: 0; padding: 10px 14px; font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--gold); }
main { padding-block: 22px 0; display: grid; gap: 20px; }

/* Éléments communs */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.panel > h3 { margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 9px 14px; font-weight: 600; font-size: 0.92rem; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.big { font-family: var(--f-display); font-size: 1.25rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 12px 26px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.seg { justify-self: start; display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 8px 14px; font-weight: 600; font-size: 0.9rem; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--court); color: #fff; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 0.86rem; background: var(--surface); font-weight: 500; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); }
.chip[aria-pressed="true"]::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.label { font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.stars { color: var(--gold); letter-spacing: 1px; font-size: 0.85rem; }
.stars .off { color: var(--line); }
/* Étoiles des joueurs : couches superposées (vide, potentiel incertain, potentiel, niveau), coupées à la demi-étoile */
.pstars { position: relative; display: inline-block; font-size: 1rem; line-height: 1; letter-spacing: 0; white-space: nowrap; vertical-align: -2px; cursor: help; }
.pstars.sm { font-size: 0.9rem; }
.sovr .pstars { font-size: 1.6rem; justify-self: end; }
.ynotes .pstars { font-size: 1.3rem; justify-self: end; }
.pstars > span { display: block; overflow: hidden; }
.pstars > span + span { position: absolute; left: 0; top: 0; }
.pstars .s0 { color: var(--line); opacity: 0.55; }
.pstars .sph { color: var(--star); opacity: 0.3; }
.pstars .spl { color: var(--star); opacity: 0.58; }
.pstars .sc { color: var(--star); }
.pstars .scr { color: var(--bad); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 700; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tr.me td { background: var(--accent-soft); }
tr.me td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.pos { display: inline-block; min-width: 34px; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.04em; padding: 1px 6px; border-radius: 4px; background: var(--court-soft); color: var(--pos-fg, var(--court)); }
.pos.gb { background: var(--accent-soft); color: var(--accent); }

/* Accueil */
.hero { display: grid; gap: 10px; padding-block: 34px 8px; }
.hero h1 { font-size: clamp(2.6rem, 8vw, 4.6rem); font-weight: 800; letter-spacing: 0.01em; text-transform: uppercase; line-height: 0.92; }
.hero h1 span { color: var(--gold); }
.hero p { max-width: 60ch; color: var(--muted); margin: 0; }
.hero .devnote { font-size: 0.85rem; padding-left: 10px; border-left: 2px solid var(--line); }
.clubs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.club { display: flex; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.club[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.club .n { font-weight: 600; line-height: 1.2; }
.club .c { font-size: 0.82rem; color: var(--muted); }

/* Tableau d'affichage */
.board { background: var(--board); color: var(--board-fg); border-radius: 10px; padding: 18px 20px; display: grid; gap: 14px; }
.board .teams { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 14px; }
.board .team { display: flex; align-items: center; gap: 10px; min-width: 0; }
.board .team.away { justify-content: flex-end; text-align: right; }
.board .team .tn { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; line-height: 1.05; overflow-wrap: anywhere; }
.board .score { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.8rem, 9vw, 4.4rem); color: var(--digit); font-variant-numeric: tabular-nums; line-height: 1; display: flex; gap: 10px; align-items: baseline; }
.board .score .sep { color: var(--board-dim); font-size: 0.6em; }
.board .meta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 0.82rem; color: var(--board-dim); }
.board .clock { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; color: var(--board-fg); font-variant-numeric: tabular-nums; }
.board .men { display: inline-flex; gap: 3px; vertical-align: middle; }
.board .men i { width: 7px; height: 14px; border-radius: 2px; background: var(--board-fg); opacity: 0.9; }
.board .men i.out { background: var(--bad); opacity: 1; }
.board .bar { height: 4px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; }
.board .bar span { display: block; height: 100%; background: var(--digit); }
@media (max-width: 520px) { .board .team .badge { display: none; } .board .team .tn { font-size: 0.98rem; } }
.feed { display: grid; gap: 0; max-height: 420px; overflow-y: auto; }
.ev { display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; padding: 7px 4px; border-bottom: 1px solid var(--line); font-size: 0.88rem; align-items: baseline; }
.ev .m { font-family: var(--f-display); font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.ev .s { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.8rem; }
.ev.key { font-weight: 600; }
.ev.mine .t::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--accent); margin-right: 7px; }
.ev.them .t::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--muted); margin-right: 7px; }
.ev.neutral { background: var(--sunk); font-family: var(--f-display); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.ev .tag { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 1px 6px; border-radius: 3px; margin-right: 6px; }
.tag.excl { background: var(--warn); color: #111; }
.tag.rouge { background: var(--bad); color: #fff; }
.tag.tm { background: var(--court); color: #fff; }
.statcmp { display: grid; gap: 8px; }
.statcmp .sr { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; gap: 10px; font-size: 0.88rem; }
.statcmp .sr .l { text-align: left; font-weight: 700; font-variant-numeric: tabular-nums; }
.statcmp .sr .rr { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.statcmp .sr .c { text-align: center; color: var(--muted); font-size: 0.8rem; }
.callout { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }

/* Terrain */
.court { position: relative; width: 100%; aspect-ratio: 4 / 3; max-width: 100%; background: var(--court); border-radius: 8px; overflow: hidden; }
.court svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.slot { position: absolute; transform: translate(-50%, -50%); background: var(--surface); border-radius: 6px; padding: 5px 8px 6px; width: 156px; box-shadow: 0 1px 2px rgba(0,0,0,0.25); display: grid; gap: 1px; }
.slot .label { font-size: 0.64rem; color: var(--court); }
.slot select { width: 100%; border: 0; background: var(--surface); color: var(--fg); font-size: 0.8rem; font-weight: 600; padding: 0; text-overflow: ellipsis; }
select option, select optgroup { background-color: var(--surface); color: var(--fg); }
.slot .ovr { font-size: 0.7rem; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 560px) {
  .court { aspect-ratio: auto; background: none; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; overflow: visible; }
  .court svg { display: none; }
  .slot { position: static; transform: none; width: auto; box-shadow: none; border: 1px solid var(--line); min-width: 0; }
  .next { text-align: left; width: 100%; }
}
.opt { display: grid; gap: 4px; }
.opt p { margin: 0; font-size: 0.84rem; color: var(--muted); }
.fatbar { width: 70px; height: 7px; background: var(--sunk); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
.fatbar span { display: block; height: 100%; }
.form { font-weight: 700; font-variant-numeric: tabular-nums; }
.attrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 18px; padding: 6px 4px 10px; white-space: normal; }
.attr { display: grid; grid-template-columns: 1fr 26px; gap: 8px; font-size: 0.83rem; align-items: center; }
.attr .v { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.attr .v.hi { color: var(--good); }
.attr .v.lo { color: var(--bad); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--sunk); }
.legend { font-size: 0.8rem; color: var(--muted); }
.footer { margin-top: 28px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-size: 0.82rem; }

/* Ville isométrique */
.citypanel { padding: 18px 18px 6px; }
.citywrap { overflow: hidden; margin: 6px -8px 0; }
.city { width: 100%; height: auto; display: block; }
.city .bld { cursor: pointer; outline: none; }
.city .bld .body { transition: transform 0.18s ease; }
.city .bld:hover .body, .city .bld:focus-visible .body { transform: translateY(-5px); }
.city .bld:focus-visible .body { filter: drop-shadow(0 0 4px var(--accent)); }
.city .gbld { outline: none; cursor: help; }
.city .gbld:hover, .city .gbld:focus-visible { filter: brightness(1.06); }
.city .sign { opacity: 0; pointer-events: none; transition: opacity 0.15s ease; }
.city .sign.ghost { opacity: 0; pointer-events: none; transition: opacity 0.15s ease; }
.city .sl1 { font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: 0.03em; fill: var(--fg); }
.city .sl2 { font-family: var(--f-body); font-size: 11.5px; fill: var(--muted); }
.city .sign.ghost .sl1 { fill: var(--muted); }
.city .isotxt { font-family: var(--f-display); letter-spacing: 0.08em; }
@media (prefers-reduced-motion: reduce) { .city .bld .body, .city .sign { transition: none; } }
@media (max-width: 620px) { .city .signs { display: none; } .citywrap { margin-inline: -12px; } }
.places { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.place { display: grid; grid-template-columns: 10px minmax(0, 1fr); grid-template-rows: auto auto; gap: 4px 12px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.place:hover { border-color: var(--muted); }
.place .sw { grid-row: 1 / 3; border-radius: 3px; }
.place .pt { display: grid; gap: 2px; min-width: 0; }
.place .pt b { font-family: var(--f-display); font-size: 1.05rem; letter-spacing: 0.02em; }
.place .pt span { font-size: 0.84rem; color: var(--muted); }
.place .cta { grid-column: 2; font-size: 0.8rem; font-weight: 700; color: var(--accent); }
.soon { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ghostchip { color: var(--muted); border-style: dashed; background: transparent; }
.ghostchip b { color: var(--fg); font-weight: 600; }

/* Tableau d'effectif */
.sub3 { font-size: 0.95rem; margin: 18px 0 6px; color: var(--muted); }
table.sq { font-size: 0.85rem; width: auto; min-width: 0; }
table.sq th, table.sq td { padding: 6px 4px; }
table.sq .fatbar { width: 34px; }
table.sq th.ac, table.sq td.ac { text-align: center; min-width: 31px; font-variant-numeric: tabular-nums; }
table.sq td.ac { font-weight: 600; }
table.sq .gs { border-left: 1px solid var(--line); }
table.sq tr.grp th { border-bottom: 0; padding-bottom: 0; }
table.sq th.gh { text-align: center; color: var(--fg); border-left: 1px solid var(--line); font-size: 0.7rem; }
table.sq .stick { position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 178px; }
table.sq tbody tr:hover td { background: var(--sunk); }
table.sq tbody tr:hover td.ac { filter: brightness(0.97); }
.sortbtn { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; }
th.sorted { color: var(--accent); }
td.h5 { background: color-mix(in srgb, var(--good) 42%, var(--surface)); }
td.h4 { background: color-mix(in srgb, var(--good) 18%, var(--surface)); }
td.h3 { background: transparent; }
td.h2 { background: color-mix(in srgb, var(--warn) 20%, var(--surface)); }
td.h1 { background: color-mix(in srgb, var(--bad) 30%, var(--surface)); }
td.ac.key { box-shadow: inset 0 0 0 1.5px var(--fg); }
.heatkey { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.78rem; margin-bottom: 4px; }
.heatkey span[class^="h"] { padding: 2px 8px; border-radius: 4px; font-weight: 600; border: 1px solid var(--line); }
.heatkey .h5 { background: color-mix(in srgb, var(--good) 42%, var(--surface)); }
.heatkey .h4 { background: color-mix(in srgb, var(--good) 18%, var(--surface)); }
.heatkey .h3 { background: var(--surface); }
.heatkey .h2 { background: color-mix(in srgb, var(--warn) 20%, var(--surface)); }
.heatkey .h1 { background: color-mix(in srgb, var(--bad) 30%, var(--surface)); }
.hand, .tit { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 4px; font-size: 0.66rem; font-weight: 800; vertical-align: 1px; }
.hand { border: 1px solid var(--line); color: var(--muted); }
.tit { background: var(--accent); color: var(--on-accent); }

/* Entraînement */
.focusgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.focus { display: grid; gap: 3px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 12px; }

.focus[aria-pressed="true"] { border-color: var(--iso-gym); box-shadow: inset 0 0 0 1px var(--iso-gym); background: color-mix(in srgb, var(--iso-gym) 10%, var(--surface)); }
.proglist { display: grid; gap: 0; }
.prog { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: center; font-size: 0.9rem; }

/* Profil d'équipe, règles, traits */
.tprof { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 4px; }
.tp { display: grid; gap: 4px; border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.tp b { font-family: var(--f-display); font-size: 1.2rem; }
.meter { display: block; height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }

.good { color: var(--good); font-weight: 600; }
.bad { color: var(--bad); font-weight: 600; }
.tsec { display: grid; gap: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
.tsech { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.95rem; color: var(--accent); }
.rules { display: grid; gap: 10px; margin-top: 8px; }
.rule { display: grid; gap: 6px; font-size: 0.86rem; color: var(--muted); }
.rule .chip { justify-self: start; }
.rule .chip[aria-pressed="false"] { color: var(--muted); }
.rsel { border: 1px solid var(--line); border-radius: 4px; background: var(--surface); padding: 1px 4px; font-size: 0.84rem; font-weight: 600; color: var(--fg); }
.tag.sys { background: var(--sunk); color: var(--fg); border: 1px solid var(--line); }
.tag.geste { background: var(--iso-office); color: #111; }
td.tr1 { background: color-mix(in srgb, var(--court) 4%, var(--surface)); }

td.tr3 { background: color-mix(in srgb, var(--court) 22%, var(--surface)); }
td.tr4 { background: color-mix(in srgb, var(--court) 34%, var(--surface)); }

/* Bonus et malus */

@media (max-width: 700px) { .modgrid { grid-template-columns: minmax(0, 1fr); } }
.modcol { display: grid; gap: 8px; align-content: start; }

.modcol > .label.bad { color: var(--bad); }
.modcard { display: grid; gap: 3px; text-align: left; border: 1px solid var(--line); border-radius: var(--r); padding: 11px 14px; background: var(--surface); }
.modcard b { font-family: var(--f-display); font-size: 1.12rem; letter-spacing: 0.01em; line-height: 1.15; }

.modcard .label { font-size: 0.66rem; }

.modchip.minus { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--surface)); background: color-mix(in srgb, var(--bad) 8%, var(--surface)); }
.modline { display: grid; gap: 3px; justify-items: start; margin-top: 4px; }
.moddesc { font-size: 0.78rem; color: var(--muted); }

.moddot.plus { background: var(--good); }
.moddot.minus { background: var(--bad); }

/* Centre de formation */

.modal { background: var(--surface); border-radius: 10px; border: 1px solid var(--line); max-width: 720px; width: 100%; padding: 22px; box-shadow: 0 20px 50px rgba(0,0,0,0.35); max-height: calc(100% - 32px); overflow-y: auto; }
.ycard h2 { font-size: 1.9rem; }

.yattr.key { box-shadow: inset 0 0 0 1.5px var(--fg); }
.yattr.h5 { background: color-mix(in srgb, var(--good) 42%, var(--surface)); }

.yt { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 4px; font-size: 0.66rem; font-weight: 800; vertical-align: 1px; background: var(--iso-youth); color: #fff; }

.steps { list-style: none; display: flex; flex-wrap: wrap; gap: 8px 22px; padding: 0; margin: 22px 0 16px; font-family: var(--f-display); font-weight: 600; font-size: 1rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }

/* Conseils, perfs, fil */

.sectors { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
.sectors b { color: var(--fg); font-variant-numeric: tabular-nums; }
table.pt { font-size: 0.82rem; }
table.pt th, table.pt td { padding: 5px 5px; }

.ev { border-left: 3px solid transparent; padding-left: 8px; }

/* Terrain et banc */

.ccard { display: grid; gap: 4px; text-align: left; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 8px 9px; font-size: 0.82rem; }

.ccard:not(:disabled):hover { border-color: var(--muted); }
.ccard.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }

.ccard.match { border-color: var(--good); box-shadow: inset 0 0 0 1px var(--good); background: color-mix(in srgb, var(--good) 8%, var(--surface)); }

.chead { display: flex; gap: 5px; align-items: center; }
.ctag { font-size: 0.64rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; background: var(--accent); color: var(--on-accent); border-radius: 3px; padding: 0 5px; }
.cfat { display: block; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.cfat span { display: block; height: 100%; }
.cline { display: flex; gap: 6px; align-items: center; justify-content: space-between; font-size: 0.76rem; }
.cnote { font-size: 0.74rem; font-weight: 700; color: var(--fg); }
.cyouth { font-size: 0.85rem; line-height: 1; }
.ctired { color: var(--bad); font-weight: 600; }
.cnote { display: inline-flex; align-items: center; gap: 6px; }
.cdrop { flex: none; cursor: help; }

.livebar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: flex; align-items: center; gap: 12px; background: var(--board); color: var(--board-fg); border-radius: 999px; padding: 8px 10px 8px 18px; box-shadow: 0 8px 26px rgba(0,0,0,0.35); max-width: calc(100% - 24px); flex-wrap: wrap; justify-content: center; }
.livebar .lbscore { font-family: var(--f-display); font-size: 1.05rem; white-space: nowrap; }
.livebar .lbscore .num { color: var(--digit); font-weight: 700; }

.livebar .seg { border-color: #2a3a48; }
.livebar .seg button { background: transparent; color: var(--board-fg); border-color: #2a3a48; padding: 6px 10px; }
.livebar .seg button[aria-pressed="true"] { background: var(--court); color: #fff; }

@media (max-width: 560px) { .livebar { border-radius: 14px; width: calc(100% - 24px); gap: 8px; padding: 8px 10px; flex-wrap: nowrap; justify-content: space-between; } .livebar .lbhint { display: none; } .livebar .lbpause { min-width: 0; padding: 9px 12px; } .livebar .lbscore { font-size: 0.9rem; } .livebar .seg button { padding: 6px 7px; } }
main:has(.livebar) { padding-bottom: 80px; }
td.ac.dnw { position: relative; }
td.ac.dnw::after { content: "▼"; position: absolute; top: 1px; right: 2px; font-size: 0.5rem; color: var(--bad); }
.up.down { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); }
@media (prefers-reduced-motion: no-preference) {
  .flash { animation: flash 0.6s ease-out; }
  @keyframes flash { from { color: #fff; } to { color: var(--digit); } }
}

.tag.coach { background: var(--iso-youth); color: #fff; }
/* Fiche joueur */
.plink { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 2px; }
.plink:hover, .plink:focus-visible { text-decoration-color: currentColor; color: var(--accent); }
.modal.sheet { max-width: 1240px; position: relative; }
.shead { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; padding-right: 58px; }
.shead h2 { font-family: var(--f-display); font-size: 2rem; margin: 6px 0 8px; line-height: 1; }
.sovr { display: grid; gap: 2px; text-align: right; }
.sovr b { font-family: var(--f-display); font-size: 2.3rem; line-height: 1; }
.sovr .pot { font-size: 0.5em; color: var(--muted); }
.sclose { position: absolute; top: 14px; right: 14px; padding: 4px 11px; }
.stiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; margin: 16px 0 4px; }
.stile { background: var(--sunk); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 2px; align-content: start; }

.schart { width: 100%; height: auto; display: block; }

.schart .cv { fill: var(--fg); font-weight: 700; }
.schart .cl { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; }
.schart .cpt { fill: var(--surface); stroke: var(--accent); stroke-width: 1.6; }
.schart .cpotb { fill: var(--star); fill-opacity: 0.14; }
.schart .cpot { stroke: var(--good); stroke-dasharray: 5 4; stroke-width: 1.2; }
.schart .cb { fill: var(--court); opacity: 0.75; }

.sattrs { display: grid; gap: 3px; }
.sattr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(60px, 110px) 24px 26px; gap: 8px; align-items: center; font-size: 0.86rem; padding: 2px 6px; border-radius: 4px; }
.sattr.key { background: var(--sunk); font-weight: 600; }
.sattr b { text-align: right; }
.sbar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.sbar span { display: block; height: 100%; background: var(--muted); }
.sbar .h5 { background: var(--good); } .sbar .h4 { background: color-mix(in srgb, var(--good) 65%, var(--warn)); } .sbar .h3 { background: var(--warn); } .sbar .h2 { background: color-mix(in srgb, var(--warn) 50%, var(--bad)); } .sbar .h1 { background: var(--bad); }
.mnote { display: inline-block; min-width: 34px; text-align: center; border-radius: 3px; padding: 0 4px; font-weight: 700; font-variant-numeric: tabular-nums; }

.mnote.nt4 { background: color-mix(in srgb, var(--good) 30%, var(--surface)); }
.mnote.nt3 { background: var(--sunk); }

.res { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 4px; font-size: 0.72rem; font-weight: 800; color: #fff; }
.res.w { background: var(--good); } .res.l { background: var(--bad); } .res.d { background: var(--muted); }
/* Accueil et glisser-déposer */
.homebtn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; flex: none; }
.homebtn:hover { border-color: var(--accent); color: var(--accent); }
.homebtn[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.dropzone { margin-top: 10px; padding: 10px; border: 1.5px dashed transparent; border-radius: 10px; transition: border-color 120ms, background-color 120ms; }

.bstyles { display: grid; gap: 6px; margin: 4px 0 6px; }

.seg.sm button { padding: 5px 9px; font-size: 0.8rem; }

/* Détails de la ville et bouton bonus/malus */

.modsbtn { display: inline-flex; gap: 3px; vertical-align: 3px; margin-left: 6px; padding: 2px 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; }

.fbar { position: relative; height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.fbar::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--muted); opacity: 0.5; }

  // ---------- Thème du club ----------
  // Accueil neutre ; une fois le club choisi, sa couleur (adoucie) devient la base et sa couleur de contraste les touches
  function hexToHsl(hex) {
    const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
    let h = 0, s = 0;
    if (mx !== mn) {
      const d = mx - mn;
      s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;

    const base = H.CLUBS.find((c) => c.id === t.id) || t;
    const [h, s0, l0] = hexToHsl(t.color);
    const [h2, s2] = hexToHsl(base.color2 || '#c8a24a');
    // Couleurs du club volontairement atténuées : la base reste sobre, le contraste n'est qu'une touche
    const grey = s0 < 0.1, s = Math.min(s0, 0.38);
    const sc = Math.min(Math.max(s2, 0.25), 0.45);

    const light = {

@media (prefers-color-scheme: dark) { html:root:not([data-theme="light"]) { ${css(dark)} } }
html:root[data-theme="dark"] { ${css(dark)} }`;
  }

    add('discipline-', aggr || homme ? 'bad' : 'info', aggr || homme ? 'Sang chaud + ' + (aggr ? 'défense agressive' : 'homme à homme') + ' : encore plus d\'exclusions.' : 'Évite la défense agressive et l\'homme à homme : chacun ajoute des exclusions.', ['tactique']);

  function adviceHtml(t, where) {

  function perfBlock(team, side, title) {
    const rows = team.players.filter((p) => ((side.mins || {})[p.id] || 0) > 0.5).map((p) => ({ p, s: (side.ps || {})[p.id] || { sh: 0, g: 0, to: 0, ex: 0, sv: 0, fa: 0 }, m: side.mins[p.id] }));

    const gks = rows.filter((r) => r.p.pos === 'GB');
    const pct = (a, b) => b ? Math.round((a / b) * 100) + ' %' : '–';
    const tag = (r) => r.s.g >= 4 && r.s.g / r.s.sh >= 0.7 ? '<span class="ptag hot">En feu</span>' : r.s.sh >= 4 && r.s.g / r.s.sh <= 0.34 ? '<span class="ptag cold">Maladroit</span>' : r.s.to >= 3 ? '<span class="ptag cold">Perd des ballons</span>' : '';

    const sector = (list) => { const x = field.filter((r) => list.includes(r.p.pos)); const g = x.reduce((a, r) => a + r.s.g, 0), sh = x.reduce((a, r) => a + r.s.sh, 0); return `${g}/${sh} (${pct(g, sh)})`; };

      <div class="sectors"><span>Ailes <b>${sector(['AiG', 'AiD'])}</b></span><span>Arrières et DC <b>${sector(['ArG', 'ArD', 'DC'])}</b></span><span>Pivot <b>${sector(['Piv'])}</b></span></div>
      <div class="scroll"><table class="pt"><thead><tr><th>Joueur</th><th class="r">Min</th><th class="r">Buts / tirs</th><th class="r">%</th><th class="r">Pertes</th><th class="r">2 min</th><th></th></tr></thead><tbody>
      ${field.map((r) => `<tr><td><span class="pos">${r.p.pos}</span> ${plink(r.p, short(r.p.name))}</td><td class="r">${Math.round(r.m)}</td><td class="r"><b>${r.s.g}</b>/${r.s.sh}</td><td class="r">${pct(r.s.g, r.s.sh)}</td><td class="r">${r.s.to}</td><td class="r">${r.s.ex || ''}</td><td>${tag(r)}</td></tr>`).join('')}
      ${gks.map((r) => `<tr class="gkrow"><td><span class="pos gb">GB</span> ${plink(r.p, short(r.p.name))}</td><td class="r">${Math.round(r.m)}</td><td class="r" colspan="2"><b>${r.s.sv}</b> arrêts / ${r.s.fa} (${pct(r.s.sv, r.s.fa)})</td><td></td><td></td><td>${gtag(r)}</td></tr>`).join('')}

  // ---------- Entraînement ----------

    const tr = G.training;

    if (lt && lt.log.length) {

      prog = `<p class="muted" style="margin:0 0 8px">Après la journée ${lt.round} · focus ${H.TRAIN[lt.focus].label.toLowerCase()}, intensité ${H.INTENSITY[lt.intensity].label.toLowerCase()} · ${lt.log.length} attribut${lt.log.length > 1 ? 's' : ''} en hausse</p>

  }

  // ---------- Centre de formation ----------
  function nextYouthRound() {

      <p class="legend" style="margin:8px 0 0">Sans réponse avant le prochain match, il signera ailleurs.</p></div>`;
  }
  function renderFormation() {
    const t = me(), nr = nextYouthRound();

    return `<div class="grid2">
      <section class="panel"><h3>Centre de formation</h3>
        ${G.youth ? youthCard(false) : `<p style="margin:0">${nr ? `Prochain jeune proposé après la <b>journée ${nr}</b>, dans ${left} match${left > 1 ? 's' : ''}.` : 'Plus de jeune à proposer cette saison.'}</p>
          <p class="muted">Un jeune sort du centre toutes les 5 journées, à un poste tiré au hasard. Ton effectif peut monter à 16 joueurs ; au-delà, il faut libérer un joueur du même poste. La feuille de match reste limitée à 14.</p>`}
      </section>

        <section class="panel"><h3>Historique</h3>${G.youthLog.length ? `<div class="scroll"><table><tbody>${G.youthLog.map((l) => `<tr><td class="r">J${l.round}</td><td><span class="pos${l.pos === 'GB' ? ' gb' : ''}">${l.pos}</span> ${esc(l.name)}</td><td class="nw">${(() => { const q = { id: l.id || l.name, age: l.age || 18, ovr: l.ovr, pot: l.pot }; const r = H.potRange(q, sref()); return sbar(r.cur, { sm: true, lo: r.lo, hi: r.hi, title: pTitle(q, r) }); })()}</td><td>${esc(l.decision)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted" style="margin:0">Aucun jeune proposé pour l\'instant.</p>'}</section>
      </div></div>`;
  }

  // ---------- Ville ----------
  const IX = 430, IY = 128;
  const P = (x, y, z) => [IX + (x - y) * 32, IY + (x + y) * 16 - (z || 0)];
  const pts = (arr) => arr.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const EDGE = 'stroke="var(--iso-edge)" stroke-width="0.8" stroke-linejoin="round"';
  const poly = (arr, fill, extra) => `<polygon points="${pts(arr)}" fill="${fill}" ${extra || ''}/>`;
  function isoBox(b) {
    const { x, y, w, d, h } = b, z = b.z || 0, c = b.c;
    const top = [P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)];
    const left = [P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x, y + d, z + h)];
    const right = [P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x + w, y, z + h)];
    return poly(left, c, EDGE) + poly(left, '#000', 'fill-opacity="0.14"') + poly(right, c, EDGE) + poly(right, '#000', 'fill-opacity="0.3"')
      + (b.noTop ? '' : poly(top, c, EDGE) + poly(top, '#fff', 'fill-opacity="0.2"'));
  }
  const hsh = (n) => { const v = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return v - Math.floor(v); };
  function winFace(b, rows, cols, fill, op, side) {
    const { x, y, w, d, h } = b, z = b.z || 0;
    const len = side === 'L' ? w : d;
    const mu = Math.min(0.16, len / (cols * 4)), mv = Math.max(4, h / (rows * 5));
    const cw = (len - mu * (cols + 1)) / cols, rh = (h - mv * (rows + 1)) / rows;
    const pt = (u, v) => side === 'L' ? P(u, y + d, v) : P(x + w, u, v);
    const o0 = side === 'L' ? x : y;
    let s = '';
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const u = o0 + mu + c * (cw + mu), v = z + mv + r * (rh + mv);
      const lit = hsh(x * 7 + y * 13 + r * 3.1 + c * 1.7 + (side === 'L' ? 0 : 50));
      const o = (op || 0.85) * (0.45 + 0.55 * lit);
      s += poly([pt(u, v), pt(u + cw, v), pt(u + cw, v + rh), pt(u, v + rh)], fill, `fill-opacity="${o.toFixed(2)}" stroke="var(--iso-edge)" stroke-width="0.4"`);
      if (rh > 6) s += `<line x1="${pt(u + cw / 2, v)[0].toFixed(1)}" y1="${pt(u + cw / 2, v)[1].toFixed(1)}" x2="${pt(u + cw / 2, v + rh)[0].toFixed(1)}" y2="${pt(u + cw / 2, v + rh)[1].toFixed(1)}" stroke="var(--iso-edge)" stroke-width="0.35"/>`;
    }
    return s;
  }
  const winL = (b, rows, cols, fill, op) => winFace(b, rows, cols, fill, op, 'L');
  const winR = (b, rows, cols, fill, op) => winFace(b, rows, cols, fill, op ? op : 0.7, 'R');
  function parapet(b) {
    const { x, y, w, d, h } = b, z = (b.z || 0) + h, m = 0.07;
    return poly([P(x + m, y + m, z), P(x + w - m, y + m, z), P(x + w - m, y + d - m, z), P(x + m, y + d - m, z)], '#000', 'fill-opacity="0.1"')
      + poly([P(x + m, y + m, z), P(x + w - m, y + m, z), P(x + w - m, y + m, z - 1.5), P(x + m, y + m, z - 1.5)], '#000', 'fill-opacity="0.12"');
  }
  function unit(x, y, z, s) {

  }
  function door(x0, x1, yf, h, fill) { return poly([P(x0, yf, 0), P(x1, yf, 0), P(x1, yf, h), P(x0, yf, h)], fill || 'var(--iso-door)', EDGE); }
  function shadowOf(b) {
    const { x, y, w, d, h } = b, dx = Math.max(0, Math.min(1.4, h / 40, 12 - x - w));
    return poly([P(x, y), P(x + w + dx, y), P(x + w + dx, y + d), P(x, y + d)], '#000', 'fill-opacity="0.09"');
  }
  function car(x, y, along, col) {
    const L = 0.46, W = 0.24;
    const b = along === 'x' ? { x, y, w: L, d: W } : { x, y, w: W, d: L };
    const cab = along === 'x' ? { x: x + 0.1, y: y + 0.02, w: 0.24, d: W - 0.04 } : { x: x + 0.02, y: y + 0.1, w: W - 0.04, d: 0.24 };
    return poly([P(b.x + 0.03, b.y + 0.03), P(b.x + b.w + 0.08, b.y + 0.03), P(b.x + b.w + 0.08, b.y + b.d + 0.03), P(b.x + 0.03, b.y + b.d + 0.03)], '#000', 'fill-opacity="0.15"')
      + isoBox(Object.assign({ h: 3.5, c: col }, b)) + isoBox(Object.assign({ h: 2.6, z: 3.5, c: 'var(--iso-glass)' }, cab));
  }
  function lamp(x, y) {
    const [gx, gy] = P(x, y, 0), [tx, ty] = P(x, y, 24);
    return `<line x1="${gx}" y1="${gy}" x2="${tx}" y2="${ty}" stroke="var(--iso-pole)" stroke-width="1.3"/><line x1="${tx}" y1="${ty}" x2="${tx + 5}" y2="${ty + 1}" stroke="var(--iso-pole)" stroke-width="1.3"/><circle cx="${tx + 5}" cy="${ty + 2}" r="1.8" fill="var(--iso-lamp)"/><circle cx="${tx + 5}" cy="${ty + 2}" r="6" fill="var(--iso-lamp)" opacity="var(--iso-glow)"/>`;
  }
  function bench(x, y) { return isoBox({ x, y, w: 0.34, d: 0.1, h: 2.5, c: 'var(--iso-trunk)' }) + isoBox({ x, y: y - 0.04, w: 0.34, d: 0.03, h: 5, c: 'var(--iso-trunk)' }); }
  function conifer(x, y, s) {
    s = s || 1;

    return `<ellipse cx="${gx}" cy="${gy}" rx="${8 * s}" ry="${4 * s}" fill="#000" fill-opacity="0.1"/><line x1="${gx}" y1="${gy}" x2="${gx}" y2="${gy - 6 * s}" stroke="var(--iso-trunk)" stroke-width="2"/>
      <polygon points="${gx - 8 * s},${gy - 5 * s} ${gx},${gy - 30 * s} ${gx + 8 * s},${gy - 5 * s}" fill="var(--iso-tree2)" ${EDGE}/><polygon points="${gx},${gy - 30 * s} ${gx + 8 * s},${gy - 5 * s} ${gx + 1},${gy - 5 * s}" fill="#000" fill-opacity="0.15"/>`;
  }
  function gable(b, rh, roof) {
    const { x, y, w, d, h } = b, z = (b.z || 0) + h, m = y + d / 2;

      + poly([P(x + w, y, z), P(x + w, y + d, z), P(x + w, m, z + rh)], b.c, EDGE) + poly([P(x + w, y, z), P(x + w, y + d, z), P(x + w, m, z + rh)], '#000', 'fill-opacity="0.3"')
      + poly([P(x, y + d, z), P(x + w, y + d, z), P(x + w, m, z + rh), P(x, m, z + rh)], roof, EDGE) + poly([P(x, y + d, z), P(x + w, y + d, z), P(x + w, m, z + rh), P(x, m, z + rh)], '#000', 'fill-opacity="0.08"');
  }
  function tree(x, y, s) {
    s = s || 1;
    const [gx, gy] = P(x, y, 0);
    return `<ellipse cx="${gx + 3 * s}" cy="${gy}" rx="${10 * s}" ry="${4.5 * s}" fill="#000" fill-opacity="0.12"/><line x1="${gx}" y1="${gy}" x2="${gx}" y2="${gy - 12 * s}" stroke="var(--iso-trunk)" stroke-width="2.4"/>
      <circle cx="${gx + 2 * s}" cy="${gy - 15 * s}" r="${8.5 * s}" fill="var(--iso-tree2)" ${EDGE}/><circle cx="${gx - 2 * s}" cy="${gy - 20 * s}" r="${8 * s}" fill="var(--iso-tree)" ${EDGE}/><circle cx="${gx + 3 * s}" cy="${gy - 22 * s}" r="${5.5 * s}" fill="var(--iso-tree)"/><circle cx="${gx - 4 * s}" cy="${gy - 24 * s}" r="${3 * s}" fill="#fff" fill-opacity="0.18"/>`;
  }
  function bush(x, y) { const [gx, gy] = P(x, y, 0); return `<ellipse cx="${gx}" cy="${gy - 3}" rx="6" ry="4.5" fill="var(--iso-tree2)" ${EDGE}/><ellipse cx="${gx - 1.5}" cy="${gy - 4.5}" rx="3" ry="2" fill="#fff" fill-opacity="0.15"/>`; }

    const [sx, sy] = P(x, y, z);
    return `<text transform="matrix(0.894 0.447 0 1 ${sx.toFixed(1)} ${sy.toFixed(1)})" font-size="${size}" font-weight="800" fill="${fill}" class="isotxt">${esc(txt)}</text>`;
  }
  function citySign(o, ghost) {
    const [sx, sy] = P(o.at[0], o.at[1], o.at[2]);
    const lw = o.label.length * 7.6, sw = o.sub.length * 6.2;
    const w = Math.max(lw, sw) + 26, hh = 42, y0 = sy - 18 - (o.lift || 0) - hh, cx = sx + (o.dx || 0);

  function setLineup(t, pos, pid) {
    const p = t.players.find((x) => x.id === pid);

    const other = Object.keys(t.lineup).find((k) => k !== pos && t.lineup[k] === pid);
    if (other) t.lineup[other] = t.lineup[pos];

  function dropPlayer(pid, zone, targetId, pos) {
    const t = me();
    t.out = t.out || [];

    const p = P(pid);
    if (!p) return;
    const starters = new Set(Object.values(t.lineup));
    const inOut = t.out.includes(pid);
    if (zone === 'slot') { if (!setLineup(t, pos, pid)) return; }
    else if (zone === 'tribune' && !inOut && !starters.has(pid)) {
      let back = targetId && t.out.includes(targetId) ? targetId : null;
      if (!back) back = t.out.slice().sort((a, b) => (P(b).pos === p.pos) - (P(a).pos === p.pos) || P(b).ovr - P(a).ovr)[0];
      if (!back) return;
      t.out = t.out.map((x) => x === back ? pid : x);
    } else if (zone === 'bench' && inOut) {
      const bench = t.players.filter((x) => !starters.has(x.id) && !t.out.includes(x.id));
      let go = targetId && bench.some((x) => x.id === targetId) ? targetId : null;
      if (!go) { const g = bench.slice().sort((a, b) => (b.pos === p.pos) - (a.pos === p.pos) || a.ovr - b.ovr)[0]; go = g && g.id; }
      if (!go) return;
      t.out = t.out.map((x) => x === pid ? go : x);

    H.ensureSheet(t);
    save();
    render();

        <div class="tsec"><span class="tsech">Défense</span>
          <div class="opt"><span class="label">Style</span><div class="seg">${Object.entries(H.DSTYLE).map(([k, l]) => `<button data-act="dstyle" data-id="${k}" aria-pressed="${tac.dstyle === k}">${l}</button>`).join('')}</div>
            <p><b style="color:var(--fg)">Point fort</b> : ${DSTYLE_TXT[tac.dstyle][0].toLowerCase()}.<br><b style="color:var(--fg)">Point faible</b> : ${DSTYLE_TXT[tac.dstyle][1].toLowerCase()}.</p></div>
          <div class="opt"><span class="label">Système</span><p style="margin:0">Base <b style="color:var(--fg)">6-0</b> : ${DEF_TXT['6-0'][0].toLowerCase()}, mais ${DEF_TXT['6-0'][1].toLowerCase()}. Les bascules ci-dessous s'appliquent seules pendant le match, par ordre de priorité.</p>
            <div class="rules">
              <div class="rule"><button class="chip" data-act="rule" data-id="mene" aria-pressed="${r.mene.on}">Pour revenir au score</button>
                <span>Si mené de ${sel('mene', 'ecart', [2, 3, 4, 5], r.mene.ecart, (v) => v + ' buts')} à partir de la ${sel('mene', 'min', [40, 45, 50, 55], r.mene.min, (v) => v + 'e')}, passer en ${sel('mene', 'sys', ['5-1', '4-2'], r.mene.sys)}</span></div>
              <div class="rule"><button class="chip" data-act="rule" data-id="sup" aria-pressed="${r.sup.on}">En supériorité numérique</button>
                <span>Quand l'adversaire a un joueur exclu, passer en ${sel('sup', 'sys', ['5-1', '4-2'], r.sup.sys)}</span></div>
              <div class="rule"><button class="chip" data-act="rule" data-id="tireur" aria-pressed="${r.tireur.on}">Contre un tireur redoutable</button>
                <span>Si un arrière adverse a 16 ou plus en tir de loin sur le terrain, passer en ${sel('tireur', 'sys', ['5-1', '4-2'], r.tireur.sys)}</span></div>
            </div>
            <p class="legend" style="margin:6px 0 0">5-1 : ${DEF_TXT['5-1'][0].toLowerCase()} ; ${DEF_TXT['5-1'][1].toLowerCase()}. 4-2 : ${DEF_TXT['4-2'][0].toLowerCase()} ; ${DEF_TXT['4-2'][1].toLowerCase()}.</p></div>
        </div>
        <div class="opt"><span class="label">Consignes · 2 maximum</span><div class="row" style="gap:8px">${H.CONSIGNES.map(([k, l]) => `<button class="chip" data-act="cons" data-id="${k}" aria-pressed="${tac.cons.includes(k)}">${l}</button>`).join('')}</div>
          <p>Une troisième consigne remplace la plus ancienne.</p></div>
      </div></section></div>`;
  }

  // ---------- Championnat ----------
  function resultRow(g) {
    const h = T(g.h), a = T(g.a);
    const mine = g.h === G.userId || g.a === G.userId;
    const s = g.hs === undefined ? '<span class="muted">–</span>' : `<b class="num">${g.hs}–${g.as}</b>`;
    return `<tr class="${mine ? 'me' : ''}"><td>${badge(h, true)} ${esc(h.name)}</td><td class="r" style="text-align:center">${s}</td><td style="text-align:right">${esc(a.name)} ${badge(a, true)}</td></tr>`;
  }
  function renderLeague() {
    const s = H.standings(G);
    const table = s.map((r, i) => {
      const t = T(r.id);
      return `<tr class="${r.id === G.userId ? 'me' : ''}"><td class="r">${i + 1}</td><td>${badge(t, true)} ${esc(t.name)} ${(t.mods || []).map((k) => { const m = H.modInfo(k); return m ? `<span class="moddot ${m.bonus ? 'plus' : 'minus'}" title="${esc(m.name)} : ${esc(m.desc)}">${m.bonus ? '+' : '−'}</span>` : ''; }).join('')}</td><td class="r">${r.j}</td><td class="r">${r.g}</td><td class="r">${r.n}</td><td class="r">${r.p}</td><td class="r">${r.bp}</td><td class="r">${r.bc}</td><td class="r">${r.bp - r.bc > 0 ? '+' : ''}${r.bp - r.bc}</td><td class="r"><b>${r.pts}</b></td></tr>`;
    }).join('');
    const last = G.results[G.results.length - 1];
    const next = G.round < G.sched.length ? G.sched[G.round].map(([h, a]) => ({ h, a })) : null;
    const sc = H.scorers(G, 10);
    return `<div class="grid2">
      <section class="panel"><h3>Classement</h3><div class="scroll"><table><thead><tr><th class="r">#</th><th>Club</th><th class="r">J</th><th class="r">G</th><th class="r">N</th><th class="r">P</th><th class="r">BP</th><th class="r">BC</th><th class="r">Diff</th><th class="r">Pts</th></tr></thead><tbody>${table}</tbody></table></div>
        <p class="legend">Victoire 2 pts, nul 1, défaite 0. Départage : points, différence de buts particulière, différence générale, buts marqués.</p></section>
      <div style="display:grid;gap:20px;min-width:0">
        ${last ? `<section class="panel"><h3>Journée ${G.results.length}</h3><div class="scroll"><table><tbody>${last.map(resultRow).join('')}</tbody></table></div></section>` : ''}
        ${next ? `<section class="panel"><h3>Journée ${G.round + 1} · à venir</h3><div class="scroll"><table><tbody>${next.map(resultRow).join('')}</tbody></table></div></section>` : ''}
        <section class="panel"><h3>Meilleurs buteurs</h3>${sc.length ? `<div class="scroll"><table><tbody>${sc.map((x, i) => `<tr class="${x.t.id === G.userId ? 'me' : ''}"><td class="r">${i + 1}</td><td>${esc(x.p.name)} <span class="pos">${x.p.pos}</span></td><td>${badge(x.t, true)}</td><td class="r"><b>${x.p.goals}</b></td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Le classement des buteurs apparaît après la 1re journée.</p>'}</section>
      </div></div>`;
  }

  // ---------- Événements ----------
  document.addEventListener('click', (e) => {
    if (e.target.id === 'bsov') { U.bsModal = false; render(); return; }
    if (e.target.id === 'modsov') { U.modsModal = false; render(); return; }
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const act = b.dataset.act, id = b.dataset.id;
    const t = G ? me() : null;
    const ms = U.m ? U.m.S[U.side] : null;
    switch (act) {
      case 'pick': U.newClub = id; render(); return;
      case 'nclose': hideNotify(); return;
      case 'modsopen': U.modsModal = true; render(); { const c = document.querySelector('#modsov [data-act=modsclose]'); if (c) c.focus(); } return;
      case 'modsclose': U.modsModal = false; render(); { const o = document.querySelector('[data-act=modsopen]'); if (o) o.focus(); } return;
      case 'bsopen': U.bsModal = true; render(); { const c = document.querySelector('#bsov [data-act=bsclose]'); if (c) c.focus(); } return;
      case 'bsclose': U.bsModal = false; render(); { const o = document.querySelector('[data-act=bsopen]'); if (o) o.focus(); } return;
      case 'bsreset': for (const p of t.players) delete p.style; save(); render(); return;
      case 'colt': { const h = hiddenCols(); U.hidden = h.includes(id) ? h.filter((x) => x !== id) : h.concat(id); try { localStorage.setItem('hbm-cols', JSON.stringify(U.hidden)); } catch (e) {} render(); return; }
      case 'mstyle': { const [pid, v] = id.split('|'); const pl = t.players.find((x) => x.id === pid); if (pl) { if (v) pl.matchStyle = v; else delete pl.matchStyle; save(); render(); } return; }
      case 'pstyle': { const [pid, v] = id.split('|'); const pl = t.players.find((x) => x.id === pid); if (pl) { if (v === H.autoStyle(pl)) delete pl.style; else pl.style = v; save(); render(); } return; }
      case 'player': openSheet(id); return;
      case 'psclose': closeSheet(); return;
      case 'devok': U.devOk = true; try { sessionStorage.setItem('hbm-dev-ok', '1'); } catch (e) { /* ignore */ } render(); return;
      case 'step2': U.homeStep = 2; render(); window.scrollTo(0, 0); return;
      case 'step1': U.homeStep = 1; render(); window.scrollTo(0, 0); return;
      case 'pickb': ensureDraft().b = id; render(); return;
      case 'pickm': ensureDraft().m = id; render(); return;
      case 'start': { const d = ensureDraft(); if (!d.b || !d.m) return; G = H.newGame(U.newClub, undefined, [d.b + '+', d.m + '-']); U.draft = null; U.homeStep = 1; } me().tactic.rules = H.defaultRules(); U.tab = 'ville'; U.view = 'pre'; U.post = null; save(); render(); return;
      case 'tab': U.tab = id; if (U.view === 'post' && id === 'match') { /* garde le résumé */ } render(); window.scrollTo(0, 0); return;
      case 'kickoff': startMatch(); return;
      case 'rest': restRound(); return;
      case 'gonext': U.tab = 'match'; U.post = null; U.view = 'pre'; render(); window.scrollTo(0, 0); return;
      case 'pause': U.paused = !U.paused; if (!U.paused) U.subSel = null; schedule(); liveUpdate([]); return;
      case 'speed': U.speed = Number(id); schedule(); liveUpdate([]); return;
      case 'finish': finishMatch(); return;
      case 'timeout': if (U.m.timeout(U.side)) { U.paused = true; U.tPanel = true; clearTimeout(U.timer); liveUpdate(U.m.ev.slice(-1)); } return;
      case 'resume': hideNotify(); U.tPanel = false; U.paused = false; U.subSel = null; liveUpdate([]); schedule(); return;
      case 'empty': ms.empty = !ms.empty; liveUpdate([]); return;
      case 'mgk': U.m.setGK(U.side, id); liveUpdate([]); return;
      case 'subpick': if (!U.paused) return; U.subSel = U.subSel === id ? null : id; liveUpdate([]); return;
      case 'subin': if (!U.paused || !U.subSel) return; U.m.manualSub(U.side, U.subSel, id); U.subSel = null; U.ctlSig = ''; liveUpdate([]); return;
      case 'subauto': if (!U.paused) return; U.m.releasePos(U.side, id); liveUpdate([]); return;
      case 'mdef': ms.forceDef = id === 'auto' ? null : id; liveUpdate([]); return;
      case 'mds': ms.tac.dstyle = id; liveUpdate([]); return;
      case 'mjeu': ms.tac.jeu = id; liveUpdate([]); return;
      case 'dstyle': t.tactic.dstyle = id; save(); render(); return;
      case 'jeu': t.tactic.jeu = id; save(); render(); return;
      case 'rule': t.tactic.rules[id].on = !t.tactic.rules[id].on; save(); render(); return;
      case 'matt': ms.tac.att = id; liveUpdate([]); return;
      case 'mcons': toggleCons(ms.tac, id); liveUpdate([]); return;
      case 'att': t.tactic.att = id; save(); render(); return;
      case 'cons': toggleCons(t.tactic, id); save(); render(); return;
      case 'auto': H.autoLineup(t); H.ensureSheet(t); save(); render(); return;
      case 'yrel': U.yRelease = id; render(); return;
      case 'ylater': U.youthModal = false; render(); return;
      case 'yrefuse': if (G.youth) { G.youthLog.unshift({ round: G.youth.round, name: G.youth.p.name, pos: G.youth.p.pos, ovr: G.youth.p.ovr, pot: G.youth.p.pot, age: G.youth.p.age, id: G.youth.p.id, decision: 'Refusé' }); G.youth = null; } U.youthModal = false; save(); render(); return;
      case 'yaccept': {
        if (!G.youth) return;
        const tm = me(), y = G.youth.p;
        let decision = 'Recruté';
        if (tm.players.length >= 16) {
          const out = tm.players.find((p) => p.id === U.yRelease);
          if (!out) return;
          tm.players = tm.players.filter((p) => p.id !== out.id);
          tm.out = (tm.out || []).filter((id) => id !== out.id);
          for (const pos of H.POS) if (tm.lineup[pos] === out.id) {
            const rep = tm.players.filter((p) => p.pos === pos).sort((a, b) => b.ovr - a.ovr)[0] || y;
            tm.lineup[pos] = rep.id;
          }
          decision = `Recruté, ${out.name} quitte le club`;
        }
        tm.players.push(y);
        for (const pos of H.POS) if (!tm.players.some((p) => p.id === tm.lineup[pos])) tm.lineup[pos] = y.id;
        H.ensureSheet(tm);
        G.youthLog.unshift({ round: G.youth.round, name: y.name, pos: y.pos, ovr: y.ovr, pot: y.pot, age: y.age, id: y.id, decision });
        G.youth = null; U.youthModal = false; U.yRelease = null; save(); render(); return;
      }
      case 'tribune': {
        const tm = me();
        tm.out = tm.out || [];
        if (tm.out.includes(id)) {
          tm.out = tm.out.filter((x) => x !== id);
          const starters = new Set(Object.values(tm.lineup));
          const c = tm.players.filter((p) => !starters.has(p.id) && !tm.out.includes(p.id) && p.id !== id).sort((a, b) => a.ovr - b.ovr)[0];
          if (c) tm.out.push(c.id);
        } else tm.out.push(id);
        H.ensureSheet(tm); save(); render(); return;
      }
      case 'sort': U.sort = U.sort.k === id ? { k: id, dir: -U.sort.dir } : { k: id, dir: 1 }; render(); return;
      case 'tfocus': G.training.focus = id; save(); render(); return;
      case 'tint': G.training.intensity = id; save(); render(); return;
      case 'next': U.view = 'pre'; U.post = null; U.tab = G.ended ? 'match' : 'ville'; render(); window.scrollTo(0, 0); return;
      case 'reset': U.confirmReset = true; render(); return;
      case 'resetNo': U.confirmReset = false; render(); return;
      case 'resetYes': clearTimeout(U.timer); U.draft = null; U.homeStep = 1; clearSave(); U.newClub = G ? G.userId : 'REN'; G = null; U.m = null; U.view = 'pre'; U.post = null; U.confirmReset = false; render(); window.scrollTo(0, 0); return;
      case 'replay': { const club = G.userId; const mods = (me().mods || []).slice(); G = H.newGame(club, undefined, mods); me().tactic.rules = H.defaultRules(); U.view = 'pre'; U.post = null; U.tab = 'ville'; save(); render(); window.scrollTo(0, 0); return; }
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.getElementById('psheet')) { closeSheet(); return; }
    if (e.key === 'Escape' && U.bsModal) { U.bsModal = false; render(); return; }
    if (e.key === 'Escape' && U.modsModal) { U.modsModal = false; render(); return; }
    if (document.getElementById('psheet')) return;
    if (e.key === ' ' && U.view === 'live' && U.m && U.tab === 'match' && !(e.target.closest && e.target.closest('button, select, input, [role="button"]'))) {
      e.preventDefault();
      if (U.tPanel) { hideNotify(); U.tPanel = false; U.paused = false; U.subSel = null; liveUpdate([]); schedule(); }
      else { U.paused = !U.paused; if (!U.paused) U.subSel = null; schedule(); liveUpdate([]); }
      return;
    }
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const g = e.target.closest && e.target.closest('svg [role="button"][data-act]');
    if (!g) return;
    e.preventDefault();
    g.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  });
  function toggleCons(tac, id) {
    const i = tac.cons.indexOf(id);
    if (i >= 0) tac.cons.splice(i, 1);
    else { tac.cons.push(id); if (tac.cons.length > 2) tac.cons.shift(); }
  }
  document.addEventListener('change', (e) => {
    const ir = e.target.closest && e.target.closest('input[data-int]');
    if (ir && U.m) { U.m.S[U.side].tac.int = Number(ir.value); U.ctlSig = null; liveUpdate([]); const n = document.querySelector('input[data-int]'); if (n) n.focus(); return; }
    const rs = e.target.closest('select[data-rule]');
    if (rs && G) {
      const v = rs.value;
      me().tactic.rules[rs.dataset.rule][rs.dataset.field] = /^\d+$/.test(v) ? Number(v) : v;
      save(); render();
      return;
    }
    const sel = e.target.closest('select[data-pos]');
    if (!sel || !G) return;
    const t = me(), pos = sel.dataset.pos, pid = sel.value;
    const other = Object.keys(t.lineup).find((k) => k !== pos && t.lineup[k] === pid);
    if (other) t.lineup[other] = t.lineup[pos];
    t.lineup[pos] = pid;
    H.ensureSheet(t);
    save();
    render();
    const again = document.getElementById('slot-' + pos);
    if (again) again.focus();
  });

  document.addEventListener('dragstart', (e) => {
    const c = e.target.closest && e.target.closest('[data-drag]');
    if (!c) return;
    e.dataTransfer.setData('text/plain', c.dataset.drag);
    e.dataTransfer.effectAllowed = 'move';
    U.dragId = c.dataset.drag;
    c.classList.add('dragging');
    document.body.classList.add('isdragging');
  });
  document.addEventListener('dragend', () => {
    U.dragId = null;
    document.body.classList.remove('isdragging');
    document.querySelectorAll('.dragging, .dropover').forEach((x) => x.classList.remove('dragging', 'dropover'));
  });
  document.addEventListener('dragover', (e) => {
    const z = U.dragId && e.target.closest && e.target.closest('[data-drop]');
    if (!z) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.dropover').forEach((x) => x !== z && x.classList.remove('dropover'));
    z.classList.add('dropover');
  });
  document.addEventListener('drop', (e) => {
    const z = U.dragId && e.target.closest && e.target.closest('[data-drop]');
    if (!z) return;
    e.preventDefault();
    const tgt = e.target.closest('[data-drag]');
    const id = U.dragId;
    U.dragId = null;
    document.body.classList.remove('isdragging');
    dropPlayer(id, z.dataset.drop, tgt && tgt.dataset.drag !== id ? tgt.dataset.drag : null, z.dataset.pos);
  });

  // ---------- Démarrage ----------
  function start(data) {
    G = load();
    if (G) {
      U.tab = (data && data.tab) || 'ville';
      if (G.last && G.last.round === G.round && !G.ended) U.post = null;
    }
    render();
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    try { window.claude.hot.snapshot(() => ({ tab: U.tab })); } catch (e) { /* ignore */ }
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();

</script>

</body>
</html>
